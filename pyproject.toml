[project]
name = "pydna-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BjornFJohansson", email = "bjornjobb@gmail.com" }
]
requires-python = ">=3.12.7"
dependencies = [
    "confz>=2.1.0",
    "platformdirs>=4.11.9",
    "prettytable>=3.18.0",
    "pydantic>=2.13.5",
    "pydna>=5.5.16",
    "requests-cache>=1.3.3",
    "tomli-w>=1.2.0",
]

[project.scripts]
pydna-utils = "pydna_utils:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
