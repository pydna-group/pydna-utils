[project]
name = "pydna-utils"
dynamic = ["version"]
description = "Utility functions to ease interactive work with pydna."
readme = "README.md"
authors = [
    { name = "BjornFJohansson", email = "bjornjobb@gmail.com" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12.7,<4.0"
dependencies = [
    "confz>=2.1.0,<3.0.0",
    "platformdirs>=4.11.9,<5.0.0",
    "prettytable>=3.18.0,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydna>=5.5.16,<6.0.0",
    "requests-cache>=1.3.3,<2.0.0",
    "tomli-w>=1.2.0,<2.0.0",
]
keywords = [
    "pydna",
    "molecular-biology",
    "dna",
    "cloning",
    "genbank",
    "bioinformatics",
    "sequence-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pydna-group/pydna-utils"
Documentation = "https://pydna-utils.readthedocs.io/"
Repository = "https://github.com/pydna-group/pydna-utils"
Issues = "https://github.com/pydna-group/pydna-utils/issues"
Changelog = "https://github.com/pydna-group/pydna-utils/blob/main/CHANGELOG.md"

[project.scripts]
pydna-utils = "pydna_utils:main"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pydna_utils/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydna_utils"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
