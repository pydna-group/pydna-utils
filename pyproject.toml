[project]
name = "pydna-utils"
version = "0.1.0"
description = "Utility functions to ease interactive work with pydna."
readme = "README.md"
authors = [
    { name = "Bjorn F. Johansson", email = "bjornjobb@gmail.com" }
]
maintainers = [
    { name = "Bjorn F. Johansson", email = "bjornjobb@gmail.com" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12.7,<4.0"
dependencies = [
    "confz>=2.1.0,<3.0.0",
    "platformdirs>=4.11.9,<5.0.0",
    "prettytable>=3.18.0,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydna>=5.5.16,<6.0.0",
    "requests-cache>=1.3.3,<2.0.0",
    "tomli-w>=1.2.0,<2.0.0",
]
keywords = [
    "pydna",
    "molecular-biology",
    "dna",
    "cloning",
    "genbank",
    "bioinformatics",
    "sequence-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pydna-group/pydna-utils"
Documentation = "https://pydna-utils.readthedocs.io/"
Repository = "https://github.com/pydna-group/pydna-utils"
Issues = "https://github.com/pydna-group/pydna-utils/issues"
Changelog = "https://github.com/pydna-group/pydna-utils/blob/main/CHANGELOG.md"

[project.scripts]
pydna-utils = "pydna_utils:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
